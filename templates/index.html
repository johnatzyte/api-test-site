{% extends 'base.html' %}

{% block title %}Home - Auto Parts Demo Store{% endblock %}

{% block content %}
    <div class="products-header">
        <h2>Featured Products</h2>
        <form id="search-form" class="search-form" role="search">
            <label for="product-search">Search products</label>
            <div class="search-controls">
                <input
                    type="search"
                    id="product-search"
                    name="q"
                    placeholder="Search by name or SKU"
                    autocomplete="off"
                >
            </div>
            <div class="filter-controls">
                <label for="category-filter">Category</label>
                <select id="category-filter" name="category">
                    <option value="">All categories</option>
                </select>
                <label for="sort-products">Sort by</label>
                <select id="sort-products" name="sort">
                    <option value="relevance">Relevance</option>
                    <option value="name_asc">Name</option>
                    <option value="price_asc">Price: low to high</option>
                    <option value="price_desc">Price: high to low</option>
                    <option value="rating_desc">Rating</option>
                </select>
                <label class="stock-filter">
                    <input type="checkbox" id="in-stock-filter" name="in_stock">
                    In stock only
                </label>
                <button type="submit" class="btn">Apply</button>
            </div>
        </form>
    </div>
    <div id="comparison-panel" class="comparison-panel" hidden>
        <div>
            <strong><span id="comparison-count">0</span> products selected</strong>
            <span class="comparison-hint">Choose up to 3 products to compare.</span>
        </div>
        <button type="button" id="compare-button" class="btn" disabled>Compare</button>
        <button type="button" id="clear-comparison" class="text-button">Clear</button>
    </div>
    <div id="product-list" class="product-grid">
        <!-- Products will be loaded here by JS -->
        <p>Loading products...</p>
    </div>
    
    <div id="pagination" class="pagination-container">
        <!-- Pagination controls will be loaded here by JS -->
    </div>
    <section id="comparison-view" class="comparison-view" hidden>
        <div class="comparison-heading">
            <h2>Compare products</h2>
            <button type="button" id="close-comparison" class="text-button">Close</button>
        </div>
        <div id="comparison-table-container"></div>
    </section>
{% endblock %}
